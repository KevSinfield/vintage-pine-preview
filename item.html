<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Item – Vintage Pine Etc. (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=20261112c">
</head>
<body data-page="item">
<!-- DIVI: Theme Builder > Single product template (one layout for every product).
     Row 1: Woo Breadcrumb.
     Row 2 (2 columns, ~64/36): left = Woo Images/Gallery (main image + 4 thumbnails, lightbox on click);
       right = Text (category label) · Woo Title · Text (status pill: in stock / sold) · Woo Price ·
       Woo Short Description (summary line) · Button "Read full description" (anchor) · Woo Add To Cart
       (hidden automatically when out of stock) · 3 × Text boxes (Dimensions, Condition, Collection & delivery).
     Row 3: Toggle module "Full description" containing Woo Description.
     Row 4: "More from the collection" = 3 × Image + Text linking to product categories. -->
<main id="main" tabindex="-1">
  <div class="wrap" id="item"></div>
  <section class="section more-collection" aria-labelledby="more-title">
    <div class="wrap">
      <div class="section-head"><h2 id="more-title">More from the collection</h2><span class="rule" aria-hidden="true"></span></div>
      <ul class="tiles cols-3" id="more-tiles"></ul>
    </div>
  </section>
</main>
<dialog class="lightbox" id="lightbox" aria-labelledby="lb-title">
  <h2 class="visually-hidden" id="lb-title">Photos</h2>
  <figure><img id="lb-img" alt=""><figcaption id="lb-count"></figcaption></figure>
  <button class="lb-btn lb-prev" type="button" id="lb-prev" aria-label="Previous photo">&#8592;</button>
  <button class="lb-btn lb-next" type="button" id="lb-next" aria-label="Next photo">&#8594;</button>
  <button class="lb-btn lb-close" type="button" id="lb-close" aria-label="Close photos">&#215;</button>
</dialog>
<script src="data/catalogue.js?v=20261112c"></script>
<script src="assets/site.js?v=20261112c"></script>
</body>
</html>
